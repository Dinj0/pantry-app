version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pantry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pantry_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pantry_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: pantry-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Primijeti da ovdje koristimo 'postgres' kao host, a ne IP adresu
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/pantry_db?schema=public"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
